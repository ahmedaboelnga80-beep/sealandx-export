<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SealandX Container Inspection Report - Professional container damage reporting and management system">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#004D40">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SEALANDX EXPORT">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>SEALANDX EXPORT</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a2e;
      overflow: hidden;
    }
    
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #004D40 0%, #00796B 50%, #009688 100%);
    }
    
    .loading-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .loading-text {
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 3px;
    }
    
    .loading-subtitle {
      color: rgba(255,255,255,0.7);
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      margin-bottom: 40px;
    }
    
    .loading-bar {
      width: 200px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .loading-bar-fill {
      width: 30%;
      height: 100%;
      background: white;
      border-radius: 4px;
      animation: loading 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(667%); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-screen">
    <img src="assets/assets/sealand_logo.png" class="loading-logo" alt="SealandX Logo" onerror="this.style.display='none'">
    <div class="loading-text">SEALANDX EXPORT</div>
    <div class="loading-subtitle">Professional Export Solutions</div>
    <div class="loading-bar">
      <div class="loading-bar-fill"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
