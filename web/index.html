<!DOCTYPE html>
<html>
<head>
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SealandX Container Inspection Report - Professional container damage reporting and management system">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#004D40">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SEALANDX EXPORT">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>SEALANDX EXPORT</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a2e;
      overflow: hidden;
    }
    
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #004D40 0%, #00796B 50%, #009688 100%);
      z-index: 999999;
      pointer-events: all;
      transition: opacity 0.5s ease-out;
    }
    
    .loading-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .loading-text {
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 3px;
    }
    
    .loading-subtitle {
      color: rgba(255,255,255,0.7);
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      margin-bottom: 40px;
    }
    
    .loading-bar {
      width: 200px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .loading-bar-fill {
      width: 30%;
      height: 100%;
      background: white;
      border-radius: 4px;
      animation: loading 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(667%); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-screen">
    <img src="assets/assets/sealand_logo.png" class="loading-logo" alt="SealandX Logo" onerror="this.style.display='none'">
    <div class="loading-text">SEALANDX EXPORT</div>
    <div class="loading-subtitle">Professional Export Solutions</div>
    <div class="loading-bar">
      <div class="loading-bar-fill"></div>
    </div>
  </div>

  <script>
    function removeLoadingScreen() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.pointerEvents = 'none';
        setTimeout(function() {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 500);
      }
    }

    // 1. Flutter first frame event
    window.addEventListener('flutter-first-frame', removeLoadingScreen);

    // 2. MutationObserver fallback
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view, flt-glass-pane, canvas')) {
        setTimeout(removeLoadingScreen, 600);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Failsafe safety timeout (6 seconds)
    setTimeout(removeLoadingScreen, 6000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
